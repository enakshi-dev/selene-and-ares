
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASTROGO | Space Explorers</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🚀 ASTROGO</h1>
    <p>Explore. Discover. Protect.</p>
  </header>

  <main>
    <section class="welcome">
      <h2>Welcome, Space Explorer!</h2>
      <p>Your adventure begins on the Moon.</p>
      <button onclick="startGame()">Start Exploring 🚀</button>
    </section>

    <section class="moon">
      <div class="astronaut">👩‍🚀</div>
      <div class="moon-object">🌑</div>
      <p>MISSION: EXPLORE THE MOON</p>
    </section>

    <p id="message">Ready for your first space adventure?</p>
  </main>

  <script src="game.js"></script>
</body>
</html>
